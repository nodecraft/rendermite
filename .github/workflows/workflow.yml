name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        node: [26]
    name: Node ${{ matrix.node }} Test
    if: (!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]'))
    # Only PR runs are cancelled: on main a cancelled test would also skip that commit's release.
    concurrency:
      group: test-${{ matrix.node }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      # Vanilla jars (Mojang) and mod jars (Modrinth) download at test time into
      # .work/fixtures; they are immutable per version, so cache them keyed on
      # the fixture definitions that decide what gets fetched.
      - name: Cache test fixtures
        uses: actions/cache@v6.1.0
        with:
          path: .work/fixtures
          key: fixtures-${{ hashFiles('test/global-setup.ts', 'test/fixtures/*.ts') }}
          restore-keys: fixtures-
      - run: node --run lint:ci
      - run: node --run typecheck
      - run: node --run build
      - run: node --run test
        env:
          # One ceiling per worker, and vitest now runs one worker per core, so
          # this has to leave room for both inside the runner's 7GB.
          NODE_OPTIONS: --max_old_space_size=3072

  # Fails when actions.lock drifts from the workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Verify actions.lock
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Pinned because Dependabot can't bump gh extensions; update it by hand.
      - run: gh extension install github/gh-actions-lock --pin v0.3.0
      - run: gh actions-lock --verify

  # Performance monitoring (reporting, not a gate). Both sides are measured on
  # this runner, in one process, so full history is needed to check out the base
  # commit: a stored number from an earlier run of main folds the difference
  # between two machines into every delta. See bench/sides.ts.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Benchmarks
    permissions:
      contents: read
      pull-requests: write # sticky benchmark comment
    # A second push should replace an in-flight run rather than race it to the same comment
    concurrency:
      group: bench-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[skip bench]')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      # Benchmarks stage one vanilla jar; share the test job's fixture cache.
      - name: Cache test fixtures
        uses: actions/cache@v6.1.0
        with:
          key: fixtures-${{ hashFiles('test/global-setup.ts', 'test/fixtures/*.ts') }}
          path: .work/fixtures
          restore-keys: fixtures-
      - name: Benchmark against the base commit
        run: node --run bench:against -- --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Upload raw numbers
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bench-json
          path: .bench/bench.json
          if-no-files-found: warn
          retention-days: 90
      # Fork PRs get a read-only token, so the numbers stay in the artifact instead of a comment.
      - name: Post benchmark comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: benchmarks
          path: .bench/comment.md

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main' && (!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]'))
    permissions:
      contents: write # release tags and GitHub releases
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs
      id-token: write # npm trusted publishing
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache here, so nothing a PR run wrote can end up in a published tarball.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: node --run build
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
